<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="免费的浏览器电路仿真器：拖放元件、连线，实时仿真直流和交流电路，内置示波器、万用表、半导体、数字逻辑与常用模块，离线可用。">
<title>电路实验室 — 在线电路仿真</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <header id="toolbar">
    <div class="logo"><span class="bolt">⚡</span> <span data-i18n="h.logo">电路实验室</span> <small data-i18n="h.logo_sub">Circuit Lab</small></div>
    <div class="grp">
      <button id="btn-run" class="run-btn" title="运行/暂停 (空格)" data-i18n-title="h.run_title"><span class="ic">▶</span> 运行</button>
      <button id="btn-reset" title="重置仿真时间与状态" data-i18n-title="h.reset_title">⟲ <span data-i18n="h.reset">重置</span></button>
    </div>
    <div class="grp">
      <button id="btn-undo" title="撤销 (Ctrl+Z)" data-i18n-title="h.undo_title">↶</button>
      <button id="btn-redo" title="重做 (Ctrl+Y)" data-i18n-title="h.redo_title">↷</button>
      <button id="btn-wire" title="导线模式 (W)" data-i18n-title="h.wire_title">✎ <span data-i18n="h.wire">导线</span></button>
      <button id="btn-select" title="选择模式：在空白处拖动框选多个器件 (V)" data-i18n-title="h.select_title"><span class="ic-sel"></span> <span data-i18n="h.select">选择</span></button>
      <button id="btn-rot" title="旋转 (R)" data-i18n-title="h.rot_title">⟳ <span data-i18n="h.rot">旋转</span></button>
      <button id="btn-del" title="删除 (Del)" data-i18n-title="h.del_title">🗑 <span data-i18n="h.del">删除</span></button>
      <button id="btn-clear" title="清空电路" data-i18n-title="h.clear_title">🧹 <span data-i18n="h.clear">清空</span></button>
      <button id="btn-analysis" title="节点电压 / 支路电流表 (KCL)" data-i18n-title="h.analysis_title">∑ <span data-i18n="h.analysis">分析</span></button>
    </div>
    <div class="grp">
      <select id="sel-example" title="示例电路" data-i18n-title="h.examples_title"></select>
    </div>
    <div class="grp">
      <button id="btn-save" title="保存到浏览器 (Ctrl+S)" data-i18n-title="h.save_title">💾 <span data-i18n="h.save">保存</span></button>
      <button id="btn-load" title="从浏览器载入" data-i18n-title="h.load_title">📂 <span data-i18n="h.load">载入</span></button>
      <button id="btn-export" title="导出 JSON 文件" data-i18n-title="h.export_title">⬇ <span data-i18n="h.export">导出</span></button>
      <button id="btn-import" title="导入 JSON 文件" data-i18n-title="h.import_title">⬆ <span data-i18n="h.import">导入</span></button>
      <input type="file" id="file-in" accept=".json,application/json" hidden>
    </div>
    <div class="grp grp-snd">
      <button id="btn-sound" title="声音开关 (默认静音；点击后开启喇叭发声)" data-i18n-title="h.sound_title" aria-pressed="false">🔇</button>
      <input type="range" id="rng-vol" min="0" max="100" value="60" title="音量" data-i18n-title="h.volume_title" aria-label="Volume">
    </div>
    <div class="grp">
      <label class="lbl"><span data-i18n="h.speed">速度</span>
        <select id="sel-speed">
          <option value="0.01">0.01×</option><option value="0.1">0.1×</option>
          <option value="0.5">0.5×</option><option value="1" selected data-i18n="h.realtime">1× 实时</option>
          <option value="2">2×</option><option value="5">5×</option>
        </select></label>
      <label class="lbl"><input type="checkbox" id="chk-current" checked> <span data-i18n="h.current_anim">电流动画</span></label>
    </div>
    <div class="grp grp-lang">
      <label class="lbl" title="界面语言 / Language" data-i18n-title="h.lang_title">🌐 <select id="sel-lang" aria-label="Language"></select></label>
    </div>
  </header>
  <aside id="palette">
    <div class="side-t"><span data-i18n="h.palette">元件库</span> <small data-i18n="h.palette_sub">Components</small></div>
    <div id="palette-body"></div>
  </aside>
  <main id="stage">
    <canvas id="cv"></canvas>
    <div id="hud"></div>
    <div id="toast"></div>
    <div id="zoombox"><button id="btn-zin" title="放大" data-i18n-title="h.zoom_in">＋</button><button id="btn-fit" title="适配视图" data-i18n-title="h.fit">⤢</button><button id="btn-zout" title="缩小" data-i18n-title="h.zoom_out">－</button></div>
    <div id="tooltip"></div>
    <div id="analysis"></div>
  </main>
  <aside id="props">
    <div id="props-body"></div>
  </aside>
  <footer id="status">
    <span data-i18n="h.status_tip">提示：从端子拖动连线 · 单击开关切换 · 滚轮缩放 · 拖动空白处平移</span>
    <span id="status-stats"></span>
  </footer>
</div>
<div id="dlg"></div>
